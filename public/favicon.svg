<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0a0908"/>
  <rect x="10" y="25" width="80" height="50" fill="none" stroke="#c9a87c" stroke-width="2"/>
  <!-- Sprocket holes left -->
  <rect x="15" y="30" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <rect x="15" y="45" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <rect x="15" y="60" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <!-- Sprocket holes right -->
  <rect x="79" y="30" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <rect x="79" y="45" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <rect x="79" y="60" width="6" height="10" fill="#1a1816" stroke="#c9a87c" stroke-width="1"/>
  <!-- Frame -->
  <rect x="25" y="30" width="50" height="40" fill="none" stroke="#c9a87c" stroke-width="1" opacity="0.5"/>
  <!-- Play triangle -->
  <polygon points="45,40 45,60 60,50" fill="#c9a87c" opacity="0.8"/>
</svg>
